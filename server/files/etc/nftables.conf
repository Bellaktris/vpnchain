#!/usr/sbin/nft -f
# A small web server, as seen from outside: 80 and 443, ping answered, every
# other port refused rather than silently dropped. SSH is not among them: it
# arrives inside the Reality inbound, to sshd on loopback (vpnchain ssh-reality).
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp accept
		tcp dport { 80, 443 } accept
		meta l4proto tcp reject with tcp reset
		meta l4proto udp reject
		drop
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
