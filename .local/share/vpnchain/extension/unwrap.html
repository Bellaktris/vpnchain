<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unwrapping link</title>
<style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --box: #f2f2f4; }
    @media (prefers-color-scheme: dark) {
        :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #a1a1a6; --box: #2c2c2e; }
    }
    body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 16px; }
    code { display: block; padding: 12px; background: var(--box); border-radius: 8px;
           word-break: break-all; font: 13px/1.4 ui-monospace, Menlo, monospace; user-select: all; }
</style>
<script type="module" src="unwrap.js"></script>
</head>
<body>
<main id="failed" hidden>
    <h1>Blocked tracker link</h1>
    <p>This link goes through <strong id="host"></strong>, and the destination
       is not in the link itself - only the tracker knows it. It stays blocked.</p>
    <code id="link"></code>
</main>
</body>
</html>
